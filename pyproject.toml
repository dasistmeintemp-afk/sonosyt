[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonosyt"
version = "0.1.0"
description = "Play the audio of YouTube videos on Sonos speakers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "soco>=0.32",
    "sonos-websocket>=0.1.3",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sonosyt = "sonosyt.cli:main"

[tool.setuptools]
packages = ["sonosyt"]

[tool.setuptools.package-data]
sonosyt = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
