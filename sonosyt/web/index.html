<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sonosyt</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #fff; --text: #1c1b19; --muted: #6b6861;
    --line: #dedbd3; --accent: #c2410c; --accent-text: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171614; --card: #22201d; --text: #eeece7; --muted: #a09c93;
            --line: #37342f; --accent: #f97316; --accent-text: #1a1206; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px 150px; }
  h1 { font-size: 1.25rem; margin: 8px 0 16px; }
  .row { display: flex; gap: 8px; }
  input, select, button { font: inherit; color: inherit; border-radius: 8px;
         border: 1px solid var(--line); background: var(--card); padding: 10px 12px; }
  input[type=search] { flex: 1; min-width: 0; }
  select { width: 100%; margin-bottom: 12px; }
  button { cursor: pointer; white-space: nowrap; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #msg { min-height: 1.5em; margin: 10px 0; color: var(--muted); }
  #msg.error { color: #dc2626; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; gap: 12px; align-items: center; background: var(--card);
       border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin-bottom: 8px; }
  li img { width: 96px; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; flex: none; }
  .meta { flex: 1; min-width: 0; }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis;
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .sub { color: var(--muted); font-size: .875rem; }
  .actions { display: flex; flex-direction: column; gap: 6px; }
  .actions button { padding: 6px 10px; font-size: .875rem; }
  #all { margin: 0 0 10px; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card);
           border-top: 1px solid var(--line); padding: 10px 16px; }
  footer .inner { max-width: 720px; margin: 0 auto; }
  #now { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #time { color: var(--muted); font-size: .875rem; font-variant-numeric: tabular-nums; }
  .controls { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .controls button { padding: 8px 12px; }
  .controls input[type=range] { flex: 1; min-width: 60px; padding: 0; accent-color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>YouTube → Sonos</h1>
  <select id="speaker" aria-label="Lautsprecher"></select>
  <form class="row" id="form">
    <input type="search" id="q" placeholder="YouTube-Link oder Suchbegriff" autofocus required>
    <button class="primary">Suchen</button>
  </form>
  <div id="msg" role="status"></div>
  <button id="all" hidden>Alle abspielen</button>
  <ul id="results"></ul>
</main>
<footer>
  <div class="inner">
    <div id="now">–</div>
    <div id="time">&nbsp;</div>
    <div class="controls">
      <button data-action="previous" aria-label="Zurück">⏮</button>
      <button data-action="toggle" id="toggle" aria-label="Wiedergabe/Pause">▶</button>
      <button data-action="next" aria-label="Weiter">⏭</button>
      <button data-action="clear" title="Warteschlange leeren">Leeren</button>
      <input type="range" id="volume" min="0" max="100" aria-label="Lautstärke">
    </div>
  </div>
</footer>
<script>
const $ = (id) => document.getElementById(id);
let results = [];
let playing = false;
let volumeBusy = 0;

function say(text, error) {
  $('msg').textContent = text || '';
  $('msg').className = error ? 'error' : '';
}

async function api(path, body) {
  const res = await fetch(path, body ? {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
  } : undefined);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function speaker() { return $('speaker').value; }

function fmt(seconds) {
  if (!seconds) return '';
  const h = Math.floor(seconds / 3600), m = Math.floor(seconds % 3600 / 60), s = seconds % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}

async function loadSpeakers(refresh) {
  try {
    const list = await api('/api/speakers' + (refresh ? '?refresh=1' : ''));
    const saved = localStorage.getItem('speaker');
    $('speaker').replaceChildren(...list.map((s) => {
      const o = document.createElement('option');
      o.value = s.name;
      o.textContent = s.group.length > 1 ? `${s.name} (Gruppe: ${s.group.join(', ')})` : s.name;
      return o;
    }));
    if (list.some((s) => s.name === saved)) $('speaker').value = saved;
    if (!list.length) say('Keine Sonos-Lautsprecher gefunden. Läuft der Server im selben Netzwerk?', true);
    refreshStatus();
  } catch (e) { say(e.message, true); }
}

async function play(ids, queue) {
  if (!speaker()) return say('Kein Lautsprecher ausgewählt.', true);
  say(queue ? 'Wird eingereiht …' : 'Wird geladen …');
  try {
    const r = await api('/api/play', {speaker: speaker(), ids, queue});
    const n = r.queued.length;
    say(n > 1 ? `${n} Titel ${queue ? 'eingereiht' : 'gestartet'}.`
              : `${queue ? 'Eingereiht' : 'Spielt'}: ${r.queued[0].title}`);
    setTimeout(refreshStatus, 800);
  } catch (e) { say(e.message, true); }
}

function render() {
  $('all').hidden = results.length < 2;
  $('results').replaceChildren(...results.map((t) => {
    const li = document.createElement('li');
    const img = document.createElement('img');
    img.src = t.thumbnail; img.alt = ''; img.loading = 'lazy';
    const meta = document.createElement('div'); meta.className = 'meta';
    const title = document.createElement('div'); title.className = 'title'; title.textContent = t.title;
    const sub = document.createElement('div'); sub.className = 'sub';
    sub.textContent = [t.uploader, fmt(t.duration)].filter(Boolean).join(' · ');
    meta.append(title, sub);
    const actions = document.createElement('div'); actions.className = 'actions';
    const now = document.createElement('button'); now.className = 'primary'; now.textContent = 'Abspielen';
    now.onclick = () => play([t.id], false);
    const later = document.createElement('button'); later.textContent = 'Einreihen';
    later.onclick = () => play([t.id], true);
    actions.append(now, later);
    li.append(img, meta, actions);
    return li;
  }));
}

$('form').onsubmit = async (e) => {
  e.preventDefault();
  say('Suche …');
  try {
    results = await api('/api/search?q=' + encodeURIComponent($('q').value));
    say(results.length ? '' : 'Nichts gefunden.');
    render();
  } catch (err) { say(err.message, true); }
};

$('all').onclick = () => play(results.map((t) => t.id), false);

$('speaker').onchange = () => { localStorage.setItem('speaker', speaker()); refreshStatus(); };

document.querySelectorAll('[data-action]').forEach((b) => b.onclick = async () => {
  if (!speaker()) return;
  let action = b.dataset.action;
  if (action === 'toggle') action = playing ? 'pause' : 'play';
  try { await api('/api/control', {speaker: speaker(), action}); setTimeout(refreshStatus, 500); }
  catch (e) { say(e.message, true); }
});

$('volume').oninput = () => { volumeBusy = Date.now(); };
$('volume').onchange = async () => {
  try { await api('/api/control', {speaker: speaker(), volume: Number($('volume').value)}); }
  catch (e) { say(e.message, true); }
};

async function refreshStatus() {
  if (!speaker() || document.hidden) return;
  try {
    const s = await api('/api/status?speaker=' + encodeURIComponent(speaker()));
    playing = s.state === 'PLAYING' || s.state === 'TRANSITIONING';
    $('toggle').textContent = playing ? '⏸' : '▶';
    $('now').textContent = s.title ? [s.title, s.artist].filter(Boolean).join(' – ') : '–';
    const known = s.duration && s.duration !== '0:00:00' && s.duration !== 'NOT_IMPLEMENTED';
    $('time').textContent = s.title ? (known ? `${s.position} / ${s.duration}` : s.position) : ' ';
    if (Date.now() - volumeBusy > 3000) $('volume').value = s.volume;
  } catch (e) { /* speaker unreachable: keep last state */ }
}

loadSpeakers(false);

// Links shared from the phone app arrive as /?q=<link>.
const shared = new URLSearchParams(location.search).get('q');
if (shared) {
  $('q').value = shared;
  history.replaceState(null, '', location.pathname);
  $('form').requestSubmit();
}
setInterval(refreshStatus, 3000);
</script>
</body>
</html>
