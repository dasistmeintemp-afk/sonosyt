services:
  sonosyt:
    build: .
    container_name: sonosyt
    restart: unless-stopped
    # Host network: needed so the server finds the Sonos speakers
    # and the speakers can reach it on port 8327.
    network_mode: host
    volumes:
      - sonosyt-cache:/cache
    # If no speakers are found (e.g. they are in another VLAN), give the address
    # of any one Sonos speaker; the others are then found through it:
    # command: ["--speaker-ip", "192.168.1.50"]

volumes:
  sonosyt-cache:
