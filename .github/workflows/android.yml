name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk sonosyt.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sonosyt-apk
          path: sonosyt.apk

      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-v$VERSION_NAME" sonosyt.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "sonosyt Android $VERSION_NAME" \
            --notes "Android-App (Fernbedienung für den sonosyt-Server). sonosyt.apk auf dem Handy herunterladen und installieren."
