name: Server

on:
  push:
    paths-ignore:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -e '.[dev]'
      - run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sonosyt .
      - name: Tools inside the image
        run: |
          docker run --rm --entrypoint deno sonosyt --version
          docker run --rm --entrypoint ffmpeg sonosyt -version | head -1
          docker run --rm --entrypoint python sonosyt -m yt_dlp --version
      - name: Container answers
        run: |
          docker run -d --name sonosyt -p 8327:8327 sonosyt
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8327/api/ping && exit 0
            sleep 1
          done
          docker logs sonosyt
          exit 1

  # A ready-made image in the GitHub Container Registry, so Unraid (or any
  # container manager) can install it and show when an update is available.
  publish:
    needs: [tests, docker]
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=0.2.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
