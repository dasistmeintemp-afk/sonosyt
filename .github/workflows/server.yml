name: Server

on:
  push:
    paths-ignore:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -e '.[dev]'
      - run: python -m pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sonosyt .
      - name: Container answers
        run: |
          docker run -d --name sonosyt -p 8327:8327 sonosyt
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8327/api/ping && exit 0
            sleep 1
          done
          docker logs sonosyt
          exit 1
